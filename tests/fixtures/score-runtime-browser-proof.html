<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>SesliTab score runtime browser proof</title>
  <style>
    @font-face { font-family:'Bravura'; src:url('../../public/smufl-keypad/Bravura.woff2') format('woff2'); font-display:block; }
    body{margin:0}#st-score-root{width:960px}
  </style>
</head>
<body>
  <div id="st-score-root"></div>
  <div id="status" data-score-render-pass="false" data-score-cursor-pass="false" data-score-note-hit-pass="false" data-score-note-resolver-pass="false" data-score-note-highlight-pass="false" data-prb-editor-selection-pass="false" data-prb-stale-render-pass="false" data-prb-part-name-pass="false" data-prc-bravura-font-pass="false" data-prc-keypad-manifest-pass="false" data-prc-keypad-timing-pass="false" data-prc-keypad-commit-pass="false">PENDING</div>

  <script src="../../public/st-score-editor-core-runtime/st-score-editor-core.runtime.js"></script>
  <script src="../../public/st-score-runtime/vendor/opensheetmusicdisplay.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "@st/score-renderer-contracts": "../../public/st-score-runtime/modules/contracts.js",
      "@st/score-renderer-core": "../../public/st-score-runtime/modules/renderer-core.js",
      "@st/score-renderer-osmd": "../../public/st-score-runtime/modules/adapter-osmd.js",
      "@st/score-renderer-browser-host": "../../public/st-score-runtime/modules/browser-host.js",
      "opensheetmusicdisplay": "../../public/st-score-runtime/modules/osmd-module-shim.mjs"
    }
  }
  </script>
  <script type="module" src="../../public/st-score-runtime/workstation-bootstrap.mjs"></script>
  <script type="module">
    import { createAutomaticRevision } from '../../src/services/teacherRevisionModel.js'
    import { buildStageS06SelectionIdentity } from '../../src/services/stageS06SelectionIdentity.js'
    import {
      getCurrentScoreRenderEvidence,
      hitTestScoreNoteDetailed,
      renderScoreView,
    } from '../../src/services/scoreRendererConsumer.js'
    import {
      createEditorSelectionContext,
      selectDetailedRendererHitWithEditor,
    } from '../../src/services/editorRendererSelectionBridge.js'
    import {
      commitBasicEditorKeypadAction,
      createBasicEditorKeypadContext,
      readEditorKeypadManifest,
    } from '../../src/services/editorKeypadIntegration.js'

    const xml = `<?xml version="1.0" encoding="UTF-8"?>
<score-partwise version="3.1">
  <part-list><score-part id="P1"><part-name>Guitar</part-name></score-part></part-list>
  <part id="P1"><measure number="1">
    <attributes>
      <divisions>1</divisions>
      <key><fifths>0</fifths></key>
      <time><beats>4</beats><beat-type>4</beat-type></time>
      <clef><sign>G</sign><line>2</line></clef>
    </attributes>
    <note><pitch><step>E</step><octave>4</octave></pitch><duration>1</duration><type>quarter</type><voice>1</voice><staff>1</staff></note>
    <note><pitch><step>G</step><octave>4</octave></pitch><duration>1</duration><type>quarter</type><voice>1</voice><staff>1</staff></note>
    <note><rest/><duration>2</duration><type>half</type><voice>1</voice><staff>1</staff></note>
  </measure></part>
</score-partwise>`

    const canonicalNotes = [
      { measure:1, measureKey:'P1:m0', partId:'P1', partIndex:0, measureIndex:0, voice:1, staff:1, startBeat:0, isRest:false, isGrace:false, isChordNote:false, duration:'quarter', beats:1, durationValue:1, divisions:1, step:'E', alter:0, octave:4 },
      { measure:1, measureKey:'P1:m0', partId:'P1', partIndex:0, measureIndex:0, voice:1, staff:1, startBeat:1, isRest:false, isGrace:false, isChordNote:false, duration:'quarter', beats:1, durationValue:1, divisions:1, step:'G', alter:0, octave:4 },
      { measure:1, measureKey:'P1:m0', partId:'P1', partIndex:0, measureIndex:0, voice:1, staff:1, startBeat:2, isRest:true, isGrace:false, isChordNote:false, duration:'half', beats:2, durationValue:2, divisions:1 },
    ]

    const status = document.getElementById('status')
    const root = document.getElementById('st-score-root')

    function findExactRuntimeHit(host) {
      const noteheads = [...root.querySelectorAll('.vf-notehead')]
      for (const element of noteheads) {
        const rect = element.getBoundingClientRect()
        if (!(rect.width > 0 && rect.height > 0)) continue
        for (const fx of [.25, .5, .75]) {
          for (const fy of [.25, .5, .75]) {
            const point = { clientX: rect.left + rect.width * fx, clientY: rect.top + rect.height * fy }
            const detailed = hitTestScoreNoteDetailed(host, point)
            if (detailed.kind === 'HIT') return { detailed, element, point }
          }
        }
      }
      return null
    }

    function eventForNoteId(score, noteId) {
      for (const part of score.parts) for (const staff of part.staves) for (const measure of staff.measures) for (const voice of measure.voices) {
        for (const event of voice.events) {
          if (event.kind === 'note' && event.note?.id === noteId) return event
          if (event.kind === 'chord' && event.notes?.some((note) => note.id === noteId)) return event
        }
      }
      return null
    }

    ;(async () => {
      try {
        if (document.documentElement.dataset.stScoreRuntimeReady !== 'true') throw new Error('runtime not ready')
        if (!globalThis.STScoreEditorCoreRuntime) throw new Error('Editor Core runtime not ready')
        const host = globalThis.__ST_SCORE_RENDER_HOST__
        if (!host || typeof host.renderMusicXml !== 'function' || typeof host.exportSvg !== 'function' || typeof host.moveCursor !== 'function' || typeof host.hitTestNoteDetailed !== 'function' || typeof host.highlight !== 'function' || typeof host.clearHighlights !== 'function') {
          throw new Error('detailed-hit ST runtime host missing')
        }

        await document.fonts.load('32px Bravura')
        if (!document.fonts.check('32px Bravura')) throw new Error('pinned Bravura font not available')
        status.dataset.prcBravuraFontPass = 'true'

        await renderScoreView(host, xml, { ticket: '1', autoResize: false, drawTitle: false, drawComposer: false })
        const firstEvidence = getCurrentScoreRenderEvidence(host)
        const firstHit = findExactRuntimeHit(host)
        if (!firstEvidence || !firstHit) throw new Error('first current-render evidence missing')

        // The exported Workstation runtime creates a new BrowserScoreHost per
        // replacement. renderEpoch may therefore repeat. Source/ticket
        // correlation must still invalidate the previous render evidence.
        await renderScoreView(host, xml, { ticket: '2', autoResize: false, drawTitle: false, drawComposer: false })
        const secondEvidence = getCurrentScoreRenderEvidence(host)
        if (!secondEvidence || secondEvidence.sourceId === firstEvidence.sourceId) throw new Error('replacement source correlation did not advance')
        const stale = hitTestScoreNoteDetailed(host, firstHit.point, firstEvidence)
        if (stale.kind !== 'STALE' || stale.sourceCorrelationMatch !== false) throw new Error('previous render evidence was not rejected as stale')
        status.dataset.prbStaleRenderPass = 'true'

        const svgPages = await host.exportSvg()
        if (!Array.isArray(svgPages) || svgPages.length === 0 || !root.querySelector('svg')) throw new Error('SVG evidence missing')
        status.dataset.scoreRenderPass = 'true'

        await host.moveCursor({ partId: 'P1', measureIndex: 0 })
        status.dataset.scoreCursorPass = 'true'
        status.dataset.cursorPartId = 'P1'
        status.dataset.cursorMeasureIndex = '0'

        const hit = findExactRuntimeHit(host)
        const ref = hit?.detailed?.target
        if (!ref || ref.partId !== 'P1' || ref.measureIndex !== 0 || ref.voice !== 1) throw new Error('exact detailed note hit evidence missing')
        status.dataset.scoreNoteHitPass = 'true'
        status.dataset.notePartId = ref.partId
        status.dataset.noteMeasureIndex = String(ref.measureIndex)
        status.dataset.noteIndex = String(ref.noteIndex)
        status.dataset.noteVoice = String(ref.voice)

        const revision = createAutomaticRevision({ revisionId:'browser-rev-1', sourceId:'browser-source-1', content:canonicalNotes })
        const revisionIdentity = Object.freeze({
          sourceId: revision.sourceId,
          sourceRevisionId: revision.sourceRevisionId,
          revisionId: revision.revisionId,
          contentFingerprint: revision.contentFingerprint,
        })
        const snapshot = { selectionNotes: revision.content, revisionIdentity }
        const editorRuntime = globalThis.STScoreEditorCoreRuntime
        const context = await createEditorSelectionContext({
          package3Snapshot:snapshot,
          teacherRevision:revision,
          editorRuntime,
          cryptoScope:globalThis.crypto,
          musicXml:xml,
          DOMParserCtor:globalThis.DOMParser,
        })
        if (context.session?.history?.present?.score?.parts?.[0]?.name !== 'Guitar') throw new Error('exact MusicXML part-name evidence was not preserved')
        status.dataset.prbPartNamePass = 'true'

        const selected = selectDetailedRendererHitWithEditor({ context, package3Snapshot:snapshot, teacherRevision:revision, detailedHit:hit.detailed, editorRuntime })
        if (selected.kind !== 'SELECTED' || selected.resolved.note !== revision.content[selected.resolved.noteIndex]) throw new Error('real Editor Core opaque-token selection failed')
        if (selected.context.session.selection?.primary?.kind !== 'note') throw new Error('Editor Core did not return canonical note selection')
        status.dataset.prbEditorSelectionPass = 'true'
        status.dataset.scoreNoteResolverPass = 'true'
        status.dataset.canonicalNoteIndex = String(selected.resolved.noteIndex)

        const manifest = readEditorKeypadManifest(editorRuntime)
        const durationEighth = manifest.groups.flatMap((group) => group.actions).find((action) => action.actionId === 'duration.eighth')
        if (durationEighth?.glyph?.smuflGlyphName !== 'note8thUp' || manifest.semanticAuthority !== 'ACTION_ID_ONLY') throw new Error('real Editor keypad manifest mismatch')
        status.dataset.prcKeypadManifestPass = 'true'

        const selectedIndex = selected.resolved.noteIndex
        const selectedMeasureKey = revision.content[selectedIndex].measureKey
        const selectedNoteIdentity = buildStageS06SelectionIdentity({
          notes: revision.content,
          measureKey: selectedMeasureKey,
          noteIndex: selectedIndex,
          revisionIdentity,
          rendererTarget: hit.detailed.target,
          interaction: 'score-editor-current-hit',
        })
        if (!selectedNoteIdentity) throw new Error('PR-B current selection identity rebuild failed')
        const keypadSnapshot = Object.freeze({
          notes: revision.content,
          selectionNotes: revision.content,
          selectedMeasureKey,
          selectedNoteIndex: selectedIndex,
          revisionIdentity,
          selectedNoteIdentity,
        })
        const keypadContext = await createBasicEditorKeypadContext({
          package3Snapshot: keypadSnapshot,
          teacherRevision: revision,
          musicXml: xml,
          editorRuntime,
          cryptoScope: globalThis.crypto,
          DOMParserCtor: globalThis.DOMParser,
        })
        const beforeNoteId = keypadContext.noteIds[selectedIndex]
        const beforeEvent = eventForNoteId(keypadContext.session.history.present.score, beforeNoteId)
        if (beforeEvent?.duration?.numerator !== 1 || beforeEvent.duration.denominator !== 4) throw new Error('SesliTab beat timing was not converted to Editor whole-note timing')
        status.dataset.prcKeypadTimingPass = 'true'

        const committed = commitBasicEditorKeypadAction(keypadContext, 'duration.eighth', {
          identity: Object.freeze({ version:'1.0.0', transactionId:'browser-prc-duration', nextRevisionId:'browser-rev-2' }),
        })
        if (committed.kind !== 'COMMITTED' || committed.nextRevisionId !== 'browser-rev-2' || committed.context.productSyncPending !== true) throw new Error('real Editor Core basic keypad commit failed')
        const afterEvent = eventForNoteId(committed.context.session.history.present.score, beforeNoteId)
        if (afterEvent?.duration?.numerator !== 1 || afterEvent.duration.denominator !== 8) throw new Error('real Editor duration.eighth action did not produce 1/8')
        status.dataset.prcKeypadCommitPass = 'true'

        await host.clearHighlights()
        await host.highlight({ target: hit.detailed.target, className: 'seslitab-note-focus' })
        if (hit.element.getAttribute('data-st-score-highlight') !== 'true' || !hit.element.classList.contains('seslitab-note-focus')) throw new Error('post-Editor exact note highlight evidence missing')
        status.dataset.scoreNoteHighlightPass = 'true'
        status.dataset.contractVersion = '0.2.0'
        status.textContent = 'PASS'
      } catch (error) {
        status.dataset.scoreRenderPass = 'false'
        status.dataset.scoreCursorPass = 'false'
        status.dataset.scoreNoteHitPass = 'false'
        status.dataset.scoreNoteResolverPass = 'false'
        status.dataset.scoreNoteHighlightPass = 'false'
        status.dataset.prbEditorSelectionPass = 'false'
        status.dataset.prbPartNamePass = 'false'
        status.dataset.prcBravuraFontPass = 'false'
        status.dataset.prcKeypadManifestPass = 'false'
        status.dataset.prcKeypadTimingPass = 'false'
        status.dataset.prcKeypadCommitPass = 'false'
        status.dataset.renderError = String(error?.message ?? error)
        status.textContent = 'FAIL'
      }
    })()
  </script>
</body>
</html>
