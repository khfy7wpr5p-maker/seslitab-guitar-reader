<!doctype html><meta charset="utf-8"><title>CE fixture payload transport</title>
<pre id="proof">RUNNING</pre><iframe id="frame" src="ce-bridge-transport-frame.html"></iframe>
<script type="module">
import { framePayloadScript } from '../../scripts/ceBridgeFixtureTransport.js'
const frame = document.getElementById('frame')
if (frame.contentWindow.location.href !== new URL(frame.getAttribute('src'), location.href).href || frame.contentDocument?.readyState !== 'complete') await new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }))
const payload = { musicXml: '<score-partwise><part id="P1">"quoted" & literal \\u003c</part></score-partwise>',
  requestId: 'transport-proof', sourceRevision: 7, structuralActionManifest: { malformed: true } }
const timer = setTimeout(() => { document.getElementById('proof').textContent = 'FAIL' }, 3000)
window.addEventListener('message', (event) => {
  if (event.data?.requestId !== payload.requestId) return
  clearTimeout(timer)
  document.getElementById('proof').dataset.details = JSON.stringify({source:event.source===frame.contentWindow,origin:event.origin,expected:location.origin,exact:JSON.stringify(event.data)===JSON.stringify(payload)})
  const valid = event.source === frame.contentWindow && event.origin === location.origin
    && JSON.stringify(event.data) === JSON.stringify(payload)
  document.getElementById('proof').textContent = valid ? 'PASS' : 'FAIL'
}, { once: true })
const script = frame.contentDocument.createElement('script')
script.textContent = framePayloadScript(payload)
frame.contentDocument.body.appendChild(script)
script.remove()
</script>
