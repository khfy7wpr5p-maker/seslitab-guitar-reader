<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>GTAB-VALIDATOR-01 browser proof</title>
</head>
<body>
  <pre id="proof">RUNNING</pre>
  <script type="module">
    import { validateGuitarTabExport } from '../../src/services/guitarTabExportValidator.js'

    const proof = document.getElementById('proof')
    const source = `<?xml version="1.0" encoding="UTF-8"?>
<score-partwise version="4.0">
  <part-list><score-part id="P1"><part-name>Guitar</part-name></score-part></part-list>
  <part id="P1"><measure number="1">
    <attributes><divisions>1</divisions></attributes>
    <note><pitch><step>C</step><octave>4</octave></pitch><duration>1</duration><voice>1</voice><staff>1</staff></note>
    <backup><duration>1</duration></backup>
    <note><unpitched><display-step>C</display-step><display-octave>4</display-octave></unpitched><duration>1</duration><voice>2</voice><staff>1</staff></note>
    <note><grace/><pitch><step>D</step><octave>4</octave></pitch><voice>3</voice><staff>1</staff></note>
  </measure></part>
</score-partwise>`

    const tab = (string = 2, fret = 1) => `<?xml version="1.0" encoding="UTF-8"?>
<score-partwise version="4.0">
  <part-list><score-part id="P1"><part-name>Guitar TAB</part-name></score-part></part-list>
  <part id="P1"><measure number="1">
    <attributes>
      <divisions>1</divisions><staves>2</staves>
      <clef number="1"><sign>G</sign><line>2</line></clef>
      <clef number="2"><sign>TAB</sign><line>5</line></clef>
      <staff-details number="2"><staff-lines>6</staff-lines>
        <staff-tuning line="1"><tuning-step>E</tuning-step><tuning-octave>2</tuning-octave></staff-tuning>
        <staff-tuning line="2"><tuning-step>A</tuning-step><tuning-octave>2</tuning-octave></staff-tuning>
        <staff-tuning line="3"><tuning-step>D</tuning-step><tuning-octave>3</tuning-octave></staff-tuning>
        <staff-tuning line="4"><tuning-step>G</tuning-step><tuning-octave>3</tuning-octave></staff-tuning>
        <staff-tuning line="5"><tuning-step>B</tuning-step><tuning-octave>3</tuning-octave></staff-tuning>
        <staff-tuning line="6"><tuning-step>E</tuning-step><tuning-octave>4</tuning-octave></staff-tuning>
      </staff-details>
    </attributes>
    <note><pitch><step>C</step><octave>4</octave></pitch><duration>1</duration><voice>1</voice><staff>1</staff></note>
    <backup><duration>1</duration></backup>
    <note><pitch><step>C</step><octave>4</octave></pitch><duration>1</duration><voice>1</voice><staff>2</staff><notations><technical><string>${string}</string><fret>${fret}</fret></technical></notations></note>
  </measure></part>
</score-partwise>`

    const target = { partId: 'P1', partIndex: 0, staff: 1, voice: 1 }
    const originalSource = source

    try {
      const selected = validateGuitarTabExport({ scoreMusicXml: source, guitarTabMusicXml: tab(), targetSelection: target })
      const grace = validateGuitarTabExport({ scoreMusicXml: source, guitarTabMusicXml: tab(), targetSelection: { ...target, voice: 3 } })
      const physical = validateGuitarTabExport({ scoreMusicXml: source, guitarTabMusicXml: tab(1, 0), targetSelection: target })

      const selectedPass = selected.ok === true && selected.facts.scoreEventCount === 1
      const sourceImmutable = source === originalSource
      const graceFailClosed = grace.ok === false && grace.category === 'SEMANTIC' && grace.code === 'GRACE_UNSUPPORTED'
      const physicalFailClosed = physical.ok === false && physical.category === 'PHYSICAL' && physical.code === 'TECHNICAL_POSITION_PITCH_MISMATCH'

      document.body.dataset.selectedTargetPass = String(selectedPass)
      document.body.dataset.sourceImmutablePass = String(sourceImmutable)
      document.body.dataset.graceFailClosedPass = String(graceFailClosed)
      document.body.dataset.physicalFailClosedPass = String(physicalFailClosed)

      if (!selectedPass || !sourceImmutable || !graceFailClosed || !physicalFailClosed) {
        throw new Error('GTAB-VALIDATOR-01 browser assertions failed')
      }
      proof.textContent = 'PASS'
    } catch (error) {
      document.body.dataset.error = String(error?.stack ?? error)
      proof.textContent = 'FAIL'
    }
  </script>
</body>
</html>
