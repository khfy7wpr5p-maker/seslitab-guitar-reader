<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>S07 inline teacher inspector browser proof</title>
  <link rel="stylesheet" href="../../src/stageS07InlineTeacherInspector.css">
</head>
<body>
  <div id="aria-live-region" aria-live="polite"></div>
  <main>
    <div class="result-tabs" role="tablist"></div>
    <section id="stage-s05-score-workspace" data-stage-s07-score-state="source">
      <div id="stage-s05-score-column"></div>
      <aside id="stage-s05-score-inspector" aria-labelledby="stage-s05-score-inspector-heading">
        <h3 id="stage-s05-score-inspector-heading">Nota İncelemesi</h3>
        <p id="stage-s05-score-inspector-placeholder"></p>
      </aside>
    </section>
  </main>
  <div id="proof"
    data-stage-s07-inline-pass="false"
    data-stage-s07-hidden-internals-pass="false"
    data-stage-s07-stale-pass="false"
    data-stage-s07-approval-separation-pass="false"
    data-stage-s07-coherence-pass="false"
    data-stage-s07-undo-pass="false"
    data-stage-s07-mobile-pass="false">PENDING</div>

<script type="module">
import {
  getPackage3MeasureSnapshot,
  publishPackage3Notes,
  selectPackage3MeasureKey,
  selectPackage3NoteIndex,
} from '../../package3MeasureBridge.js'
import {
  applyTeacherUiCorrection,
  getTeacherUiWorkspace,
  initPackage8TeacherUi,
} from '../../src/package8TeacherUi.js'
import {
  getTeacherWorkspaceApplicableApproval,
  getTeacherWorkspaceCurrentRevision,
  undoTeacherWorkspace,
} from '../../src/services/teacherWorkspaceModel.js'
import { parseMusicXmlToNotes } from '../../src/services/musicEngine.js'
import { registerMusicXmlSourceForNotes } from '../../src/services/musicXmlSourceRegistry.js'
import { canonicalizeStageFRevision } from '../../src/services/stageFCanonicalization.js'
import { materializeAndRevalidateStageFCorrectedMusicXml } from '../../src/services/stageFCorrectedMusicXml.js'
import {
  applyStageS07InlineTeacherInspectorUi,
  approveStageS07CurrentRevision,
  renderStageS07InlineInspector,
} from '../../src/stageS07InlineTeacherInspectorUi.js'
import { syncStageS06RevisionBinding } from '../../src/stageS06ExactSelectionUi.js'

const proof = document.getElementById('proof')
const xml = `<?xml version="1.0" encoding="UTF-8"?><score-partwise version="4.0"><part-list><score-part id="P1"><part-name>Guitar</part-name></score-part></part-list><part id="P1"><measure number="1" implicit="yes"><attributes><divisions>4</divisions><time><beats>4</beats><beat-type>4</beat-type></time></attributes><note><pitch><step>C</step><octave>4</octave></pitch><duration>4</duration><voice>1</voice><type>quarter</type><staff>1</staff></note></measure></part></score-partwise>`

try {
  let counter = 0
  initPackage8TeacherUi(document, {
    id(prefix) { counter += 1; return `${prefix}-s07-${counter}` },
    now() { counter += 1; return `2026-09-01T02:${String(counter).padStart(2, '0')}:00.000Z` },
  })
  document.getElementById('teacher-actor-id').value = 'teacher-s07-browser'

  const parsed = parseMusicXmlToNotes(xml)
  if (parsed?.error || !Array.isArray(parsed.notes) || parsed.notes.length !== 1) throw new Error('source parse failed')
  const sourceNotes = parsed.notes
  registerMusicXmlSourceForNotes(sourceNotes, xml)
  publishPackage3Notes(sourceNotes)

  if (!applyStageS07InlineTeacherInspectorUi(document)) throw new Error('S07 init failed')
  const sourceWorkspace = getTeacherUiWorkspace(document)
  if (!sourceWorkspace) throw new Error('inline workspace not prepared')

  syncStageS06RevisionBinding(document)
  if (!selectPackage3MeasureKey(sourceNotes[0].measureKey)) throw new Error('measure select failed')
  if (!selectPackage3NoteIndex(0)) throw new Error('note select failed')
  renderStageS07InlineInspector(document)

  const inspector = document.getElementById('stage-s07-inline-teacher-inspector')
  const controls = [...inspector.querySelectorAll('[data-stage-s07-field]')]
  const fields = new Set(controls.map((node) => node.dataset.stageS07Field))
  for (const required of ['step', 'alter', 'octave', 'durationValue']) {
    if (!fields.has(required)) throw new Error(`missing field ${required}`)
  }
  proof.dataset.stageS07InlinePass = 'true'

  const visibleText = inspector.textContent.toLowerCase()
  for (const forbidden of ['revisionid', 'sourceid', 'actorid', 'midi', 'frequency', 'contentfingerprint', 'raw json']) {
    if (visibleText.includes(forbidden)) throw new Error(`internal leaked: ${forbidden}`)
  }
  proof.dataset.stageS07HiddenInternalsPass = 'true'

  const saveButton = inspector.querySelector('.stage-s07-apply-field')
  const minHeight = Number.parseFloat(getComputedStyle(saveButton).minHeight)
  if (!(minHeight >= 44)) throw new Error(`touch target too small: ${minHeight}`)
  if (window.innerWidth <= 420 && document.documentElement.scrollWidth > window.innerWidth + 1) throw new Error('mobile overflow')
  proof.dataset.stageS07MobilePass = 'true'

  // Approval is a separate explicit action on the exact source revision.
  if (!approveStageS07CurrentRevision(document)) throw new Error('explicit approval failed')
  if (!getTeacherWorkspaceApplicableApproval(getTeacherUiWorkspace(document))) throw new Error('explicit approval missing')

  // Re-select and use the existing Package 8 correction authority directly;
  // S06 must invalidate the old selection as soon as revision identity changes.
  if (!selectPackage3MeasureKey(sourceNotes[0].measureKey) || !selectPackage3NoteIndex(0)) throw new Error('reselect failed')
  const beforeCorrectionSnapshot = getPackage3MeasureSnapshot()
  document.getElementById('teacher-field-select').value = '0:step'
  document.getElementById('teacher-field-value').value = 'D'
  const corrected = applyTeacherUiCorrection(document)
  if (!corrected) throw new Error('immutable correction failed')
  if (getTeacherWorkspaceApplicableApproval(corrected)) throw new Error('approval silently carried to correction')
  syncStageS06RevisionBinding(document)
  const afterCorrectionSnapshot = getPackage3MeasureSnapshot()
  if (beforeCorrectionSnapshot.selectedNoteIndex !== 0 || afterCorrectionSnapshot.selectedNoteIndex !== null) {
    throw new Error('stale selection not invalidated')
  }
  renderStageS07InlineInspector(document)
  if (!document.getElementById('stage-s07-inline-fields').hidden) throw new Error('stale editor remained open')
  proof.dataset.stageS07StalePass = 'true'
  proof.dataset.stageS07ApprovalSeparationPass = 'true'

  // Use the exact current Package 8 history through Stage F coherence gates.
  const canonical = canonicalizeStageFRevision({
    history: corrected.history,
    expectation: corrected.expectation,
    revisionId: 'stage-s07-canonical-revision',
    eventId: 'stage-s07-canonical-event',
    operationIdPrefix: 'stage-s07-canonical-operation',
    createdAt: '2026-09-01T02:30:00.000Z',
  })
  if (canonical.status !== 'applied') throw new Error(`canonicalization failed: ${canonical.status}`)
  const materialized = materializeAndRevalidateStageFCorrectedMusicXml({
    history: canonical.history,
    sourceNotes,
    canonicalizationEvidence: canonical.evidence,
  })
  if (!materialized.ok || !materialized.musicXml.includes('<step>D</step>')) throw new Error(`materialization failed: ${materialized.reason ?? materialized.status}`)
  const reparsed = parseMusicXmlToNotes(materialized.musicXml)
  if (reparsed?.error || reparsed.notes?.[0]?.step !== 'D' || reparsed.notes?.[0]?.midi !== 62) throw new Error('corrected MusicXML coherence failed')
  if (sourceNotes[0].step !== 'C' || sourceNotes[0].midi !== 60) throw new Error('source note mutated')
  proof.dataset.stageS07CoherencePass = 'true'

  // Undo creates another immutable revision; history/root remain intact.
  const current = getTeacherWorkspaceCurrentRevision(corrected)
  const rootRevision = corrected.history.revisions[0]
  const undone = undoTeacherWorkspace({
    workspace: corrected,
    targetRevisionId: rootRevision.revisionId,
    revisionId: 'stage-s07-undo-revision',
    eventId: 'stage-s07-undo-event',
    createdAt: '2026-09-01T02:31:00.000Z',
  })
  const undoCurrent = getTeacherWorkspaceCurrentRevision(undone)
  if (undoCurrent.revisionId === current.revisionId || undoCurrent.content[0].step !== 'C' || undone.history.revisions.length !== corrected.history.revisions.length + 1) {
    throw new Error('immutable undo failed')
  }
  if (corrected.history.revisions[0].content[0].step !== 'C') throw new Error('undo erased history')
  proof.dataset.stageS07UndoPass = 'true'
  proof.textContent = 'PASS'
} catch (error) {
  proof.dataset.renderError = String(error?.message ?? error)
  proof.textContent = 'FAIL'
}
</script>
</body>
</html>
