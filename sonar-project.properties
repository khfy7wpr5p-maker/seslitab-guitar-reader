sonar.projectKey=khfy7wpr5p-maker_seslitab-guitar-reader
sonar.projectName=SesliTab

# Analyze first-party application code while excluding generated/runtime artifacts.
sonar.sources=.
sonar.tests=tests,browser-tests,scripts
# Exact CI browser proof safelist; product/deploy/security scripts remain sources.
sonar.test.inclusions=tests/**/*.test.js,tests/e2e/**/*.spec.js,browser-tests/**/*.test.mjs,scripts/verifyCeBridgeStructuralBrowser.js,scripts/verifyPrCKeypadBrowser.js,scripts/verifyPrDEditorBrowser.js,scripts/verifyPrECoexistenceBrowser.js,scripts/verifyPrFAccessibilityBrowser.js,scripts/verifyS14CoreRuntimeBrowser.js,scripts/verifyS14FailedReplacementBrowser.js,scripts/verifyS14MobileMenuHostOcclusionBrowser.js,scripts/verifyS14MobileScrollSettleProductionBrowser.js,scripts/verifyS14SmoosicProductionCdpBrowser.js,scripts/verifyS14SourceLifecycleAcceptanceBrowser.js,scripts/verifyS15SmoosicWritebackBrowser.js,scripts/verifySes147AuthRosterBrowser.js,scripts/verifySes153TeacherAuthorityBrowser.js,scripts/verifySmoosicCorrectionOverlayBrowser.js,scripts/verifySti17CrossRealmBrowser.js,scripts/verifySti17MobileEditorCleanupBrowser.js,scripts/verifySti17SingleSelectionAuthorityBrowser.js,scripts/s14CdpProofHarness.js,scripts/ses153BrowserProofSession.js,scripts/ceBridgeFixtureTransport.js
# npm-generated dependency resolution metadata is audited separately by Dependency Security.
# Keep first-party JSON, package manifests, tests and build configuration in their existing scope.
sonar.exclusions=node_modules/**,tests/**,browser-tests/**,artifacts/**,dist/**,coverage/**,experiments/smoosic-mobile/node_modules/**,experiments/smoosic-mobile/dist/**,public/runtime/**,public/vendor/**,**/package-lock.json

sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Browser-proof scripts and the GTAB runtime-preparation orchestrator are CI/build infrastructure,
# not shipped application runtime. Their contracts execute in CI outside the Node LCOV boundary.
sonar.coverage.exclusions=scripts/s14CdpProofHarness.js,scripts/verifyS14*Browser.js,scripts/verifyS15SmoosicWritebackBrowser.js,scripts/verifyCeBridgeStructuralBrowser.js,scripts/verifySmoosicCorrectionOverlayBrowser.js,scripts/ses153BrowserProofSession.js,scripts/verifySes153TeacherAuthorityBrowser.js,scripts/prepareGuitarTabEditorRuntime.js
sonar.cpd.exclusions=scripts/s14CdpProofHarness.js,scripts/verifyS14*Browser.js,scripts/verifyS15SmoosicWritebackBrowser.js,scripts/verifyCeBridgeStructuralBrowser.js,scripts/verifySmoosicCorrectionOverlayBrowser.js,scripts/ses153BrowserProofSession.js,scripts/verifySes153TeacherAuthorityBrowser.js

# Baseline phase: report findings without turning existing technical debt into
# a merge blocker. Enable quality-gate waiting only after the first baseline
# has been reviewed and accepted.
sonar.qualitygate.wait=false
