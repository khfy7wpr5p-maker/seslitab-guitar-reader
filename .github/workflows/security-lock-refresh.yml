name: Security lock refresh

on:
  push:
    branches:
      - security/qs-6-16-0

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/qs-6-16-0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh package lock from package.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lock when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh package-lock for qs security override"
          git push origin HEAD:security/qs-6-16-0
