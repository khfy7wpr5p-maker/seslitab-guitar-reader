name: GTAB-09D Lock Refresh

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: gtab09d-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate package lock from declared overrides
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify patched dependency graph
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev
          npm audit

      - name: Persist generated package lock to PR branch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh patched dependency lock"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Upload generated package lock
        uses: actions/upload-artifact@v4
        with:
          name: gtab09d-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
