name: SonarQube Diagnostics Export

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Regression Quality main workflow run ID that produced sonar-report-task
        required: true
        type: string
  workflow_run:
    workflows:
      - Regression Quality
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: sonarqube-diagnostics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Export SonarQube issues
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_repository.fork == false &&
       github.event.workflow_run.head_branch == 'main')

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve source Regression Quality run
        id: source-run
        shell: bash
        env:
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            source_run_id="$WORKFLOW_RUN_ID"
          else
            source_run_id="$MANUAL_RUN_ID"
          fi

          if ! [[ "$source_run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::A valid Regression Quality workflow run ID is required."
            exit 1
          fi

          echo "run_id=$source_run_id" >> "$GITHUB_OUTPUT"

      - name: Download exact Sonar Compute Engine task metadata
        uses: actions/download-artifact@v4
        with:
          name: sonar-report-task
          path: artifacts/sonar-report-task
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.source-run.outputs.run_id }}

      - name: Resolve SonarQube project and exact CE task
        id: task
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is not configured."
            exit 1
          fi

          project_key="$(sed -n 's/^sonar\.projectKey=//p' sonar-project.properties | head -n 1 | xargs)"
          if [ -z "$project_key" ]; then
            echo "::error::sonar.projectKey is missing from sonar-project.properties."
            exit 1
          fi

          report_file="artifacts/sonar-report-task/report-task.txt"
          if [ ! -s "$report_file" ]; then
            echo "::error::Sonar report-task.txt artifact is missing or empty."
            exit 1
          fi

          ce_task_id="$(sed -n 's/^ceTaskId=//p' "$report_file" | head -n 1 | xargs)"
          server_url="$(sed -n 's/^serverUrl=//p' "$report_file" | head -n 1 | xargs)"

          if [ -z "$ce_task_id" ]; then
            echo "::error::ceTaskId is missing from report-task.txt."
            exit 1
          fi
          if [ -z "$server_url" ] || ! [[ "$server_url" =~ ^https?:// ]]; then
            echo "::error::A valid serverUrl is missing from report-task.txt."
            exit 1
          fi

          server_url="${server_url%/}"
          echo "project_key=$project_key" >> "$GITHUB_OUTPUT"
          echo "ce_task_id=$ce_task_id" >> "$GITHUB_OUTPUT"
          echo "server_url=$server_url" >> "$GITHUB_OUTPUT"

      - name: Wait for exact Sonar Compute Engine task
        id: ce-task
        shell: bash
        env:
          CE_TASK_ID: ${{ steps.task.outputs.ce_task_id }}
          SONAR_HOST_URL: ${{ steps.task.outputs.server_url }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 120); do
            response="$(
              curl --fail-with-body --silent --show-error \
                --user "$SONAR_TOKEN:" \
                --get "$SONAR_HOST_URL/api/ce/task" \
                --data-urlencode "id=$CE_TASK_ID"
            )"

            status="$(jq -r '.task.status // empty' <<<"$response")"
            analysis_id="$(jq -r '.task.analysisId // empty' <<<"$response")"

            case "$status" in
              SUCCESS)
                if [ -z "$analysis_id" ]; then
                  echo "::error::Exact CE task succeeded without an analysisId."
                  exit 1
                fi
                echo "analysis_id=$analysis_id" >> "$GITHUB_OUTPUT"
                echo "SonarQube exact CE task $CE_TASK_ID completed successfully."
                exit 0
                ;;
              FAILED|CANCELED)
                echo "::error::SonarQube exact CE task $CE_TASK_ID ended with status $status."
                jq -c '.task | {id,status,errorMessage,errorStacktrace}' <<<"$response" || true
                exit 1
                ;;
              PENDING|IN_PROGRESS)
                echo "Waiting for exact SonarQube CE task $CE_TASK_ID ($attempt/120): $status"
                sleep 5
                ;;
              *)
                echo "::error::Unexpected or missing SonarQube CE task status for $CE_TASK_ID."
                jq -c '.task // .' <<<"$response" || true
                exit 1
                ;;
            esac
          done

          echo "::error::Exact SonarQube CE task $CE_TASK_ID did not complete within 600 seconds."
          exit 1

      - name: Export Security and Reliability issues
        shell: bash
        env:
          PROJECT_KEY: ${{ steps.task.outputs.project_key }}
          SONAR_HOST_URL: ${{ steps.task.outputs.server_url }}
          ANALYSIS_ID: ${{ steps.ce-task.outputs.analysis_id }}
        run: |
          set -euo pipefail
          out="artifacts/sonarqube-diagnostics"
          mkdir -p "$out"

          fetch_page() {
            local quality="$1"
            local page="$2"
            local destination="$3"

            curl --fail-with-body --silent --show-error \
              --user "$SONAR_TOKEN:" \
              --get "$SONAR_HOST_URL/api/issues/search" \
              --data-urlencode "componentKeys=$PROJECT_KEY" \
              --data-urlencode "branch=main" \
              --data-urlencode "impactSoftwareQualities=$quality" \
              --data-urlencode "issueStatuses=OPEN,CONFIRMED,ACCEPTED,FALSE_POSITIVE" \
              --data-urlencode "s=IMPACT_RANK" \
              --data-urlencode "ps=500" \
              --data-urlencode "p=$page" \
              > "$destination"
          }

          fetch_all_issues() {
            local quality="$1"
            local destination="$2"
            local first_page="$out/.${quality,,}-page-1.json"

            fetch_page "$quality" 1 "$first_page"

            local total
            local page_size
            local pages
            total="$(jq -r '.paging.total // (.issues | length)' "$first_page")"
            page_size="$(jq -r '.paging.pageSize // 500' "$first_page")"
            pages=$(( (total + page_size - 1) / page_size ))

            cp "$first_page" "$destination"

            if [ "$pages" -gt 1 ]; then
              for page in $(seq 2 "$pages"); do
                local page_file="$out/.${quality,,}-page-$page.json"
                local merged="$out/.${quality,,}-merged.json"

                fetch_page "$quality" "$page" "$page_file"
                jq -s '{
                  paging: .[0].paging,
                  issues: (.[0].issues + .[1].issues),
                  components: ((.[0].components // []) + (.[1].components // []) | unique_by(.key)),
                  rules: ((.[0].rules // []) + (.[1].rules // []) | unique_by(.key))
                }' "$destination" "$page_file" > "$merged"
                mv "$merged" "$destination"
              done
            fi

            local collected
            collected="$(jq -r '.issues | length' "$destination")"
            if [ "$collected" -ne "$total" ]; then
              echo "::error::$quality export incomplete: collected $collected of $total issues."
              exit 1
            fi

            rm -f "$out"/".${quality,,}-page-"*.json
          }

          fetch_all_issues "SECURITY" "$out/security-issues.raw.json"
          fetch_all_issues "RELIABILITY" "$out/reliability-issues.raw.json"

          curl --fail-with-body --silent --show-error \
            --user "$SONAR_TOKEN:" \
            --get "$SONAR_HOST_URL/api/qualitygates/project_status" \
            --data-urlencode "analysisId=$ANALYSIS_ID" \
            > "$out/quality-gate.json"

          jq '{
            total: (.paging.total // (.issues | length)),
            issues: [
              .issues[] | {
                key,
                rule,
                severity,
                status,
                component,
                line,
                message,
                impacts,
                creationDate,
                updateDate
              }
            ]
          }' "$out/security-issues.raw.json" > "$out/security-issues.json"

          jq '{
            total: (.paging.total // (.issues | length)),
            issues: [
              .issues[] | {
                key,
                rule,
                severity,
                status,
                component,
                line,
                message,
                impacts,
                creationDate,
                updateDate
              }
            ]
          }' "$out/reliability-issues.raw.json" > "$out/reliability-issues.json"

          jq -s '{
            generatedFrom: "SonarQube Web API",
            branch: "main",
            security: .[0],
            reliability: .[1]
          }' "$out/security-issues.json" "$out/reliability-issues.json" > "$out/issues.json"

      - name: Build diagnostic summary
        shell: bash
        run: |
          set -euo pipefail
          out="artifacts/sonarqube-diagnostics"

          print_quality() {
            local label="$1"
            local quality="$2"
            local file="$3"
            local total
            total="$(jq -r '.total' "$file")"

            echo "## $label — $total issue(s)"
            echo
            echo "### Impact severity"
            jq -r --arg quality "$quality" '
              [
                .issues[]
                | .impacts[]?
                | select(.softwareQuality == $quality)
                | .severity
              ]
              | group_by(.)
              | map({severity: .[0], count: length})
              | sort_by(-.count)
              | if length == 0 then ["- No impact severity data"] else map("- \(.severity): \(.count)") end
              | .[]
            ' "$file"
            echo
            echo "### Top rules"
            jq -r '
              .issues
              | group_by(.rule)
              | map({
                  rule: .[0].rule,
                  count: length,
                  example: .[0].message
                })
              | sort_by(-.count, .rule)
              | .[:20]
              | if length == 0 then ["- No issues"] else map("- \(.rule): \(.count) — \(.example)") end
              | .[]
            ' "$file"
            echo
          }

          {
            echo "# SonarQube diagnostics"
            echo
            print_quality "Security" "SECURITY" "$out/security-issues.json"
            print_quality "Reliability" "RELIABILITY" "$out/reliability-issues.json"
            echo "## Quality Gate"
            echo
            jq -r '"- Status: " + (.projectStatus.status // "UNKNOWN")' "$out/quality-gate.json"
          } | tee "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"

          echo
          echo "Compact issue inventory:"
          jq -r '
            .security.issues[]
            | "SECURITY\t\(.rule // "-")\t\(.component // "-"):\(.line // 0)\t\(.message // "-")"
          ' "$out/issues.json" | head -n 50 || true
          jq -r '
            .reliability.issues[]
            | "RELIABILITY\t\(.rule // "-")\t\(.component // "-"):\(.line // 0)\t\(.message // "-")"
          ' "$out/issues.json" | head -n 50 || true

      - name: Upload SonarQube diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-diagnostics
          path: artifacts/sonarqube-diagnostics
          if-no-files-found: error
          retention-days: 14
