name: SonarQube Diagnostics Export

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Regression Quality main workflow run ID that produced sonar-report-task
        required: true
        type: string
  workflow_run:
    workflows:
      - Regression Quality
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: sonarqube-diagnostics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Export SonarQube issues
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_repository.fork == false &&
       github.event.workflow_run.head_branch == 'main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve and validate source Regression Quality run
        id: source-run
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.source_run_id }}
        run: node scripts/sonarDiagnostics.mjs verify-source

      - name: Download exact Sonar Compute Engine task metadata
        uses: actions/download-artifact@v4
        with:
          name: sonar-report-task
          path: artifacts/sonar-report-task
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.source-run.outputs.run_id }}

      - name: Export exact-analysis Security and Reliability diagnostics
        id: export
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: node scripts/sonarDiagnostics.mjs export

      - name: Build diagnostic summary
        shell: bash
        run: |
          set -euo pipefail
          out="artifacts/sonarqube-diagnostics"

          print_quality() {
            local label="$1"
            local quality="$2"
            local file="$3"
            local total
            total="$(jq -r '.total' "$file")"

            echo "## $label — $total issue(s)"
            echo
            echo "### Impact severity"
            jq -r --arg quality "$quality" '
              [
                .issues[]
                | .impacts[]?
                | select(.softwareQuality == $quality)
                | .severity
              ]
              | group_by(.)
              | map({severity: .[0], count: length})
              | sort_by(-.count)
              | if length == 0 then ["- No impact severity data"] else map("- \(.severity): \(.count)") end
              | .[]
            ' "$file"
            echo
            echo "### Top rules"
            jq -r '
              .issues
              | group_by(.rule)
              | map({
                  rule: .[0].rule,
                  count: length,
                  example: .[0].message
                })
              | sort_by(-.count, .rule)
              | .[:20]
              | if length == 0 then ["- No issues"] else map("- \(.rule): \(.count) — \(.example)") end
              | .[]
            ' "$file"
            echo
          }

          {
            echo "# SonarQube diagnostics"
            echo
            print_quality "Security" "SECURITY" "$out/security-issues.json"
            print_quality "Reliability" "RELIABILITY" "$out/reliability-issues.json"
            echo "## Quality Gate"
            echo
            jq -r '"- Status: " + (.projectStatus.status // "UNKNOWN")' "$out/quality-gate.json"
          } | tee "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"

          echo
          echo "Compact issue inventory:"
          jq -r '
            .security.issues[]
            | "SECURITY\t\(.rule // "-")\t\(.component // "-"):\(.line // 0)\t\(.message // "-")"
          ' "$out/issues.json" | head -n 50 || true
          jq -r '
            .reliability.issues[]
            | "RELIABILITY\t\(.rule // "-")\t\(.component // "-"):\(.line // 0)\t\(.message // "-")"
          ' "$out/issues.json" | head -n 50 || true

      - name: Upload SonarQube diagnostic artifact
        if: success() && steps.export.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-diagnostics
          path: artifacts/sonarqube-diagnostics
          if-no-files-found: error
          retention-days: 14
