name: TD-PROD-15 Candidate Range Refresh

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Refresh secure gRPC override range
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.overrides = {
            ...(pkg.overrides || {}),
            '@grpc/grpc-js': '^1.13.6',
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          NODE
          npm install --package-lock-only --ignore-scripts
          npm update @grpc/grpc-js --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high

      - name: Commit refreshed package files
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No package refresh needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(SES-127): use secure gRPC override range"
          git push origin "HEAD:$TARGET_BRANCH"
