name: Regression Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-baseline:
    name: Playwright protected baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install application dependencies
        run: npm ci --ignore-scripts

      - name: Install isolated Playwright test dependency
        run: npm install --ignore-scripts --no-save --package-lock=false @playwright/test@1.63.0

      - name: Install Chromium and WebKit for Playwright
        run: ./node_modules/.bin/playwright install --with-deps chromium webkit

      - name: Run protected SesliTab browser baseline
        run: ./node_modules/.bin/playwright test

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-baseline-evidence
          path: |
            artifacts/playwright-report
            test-results
          if-no-files-found: ignore

  sonarqube-analysis:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 24 for coverage
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java 21 for Firebase emulator coverage
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies for coverage
        run: npm ci --ignore-scripts

      - name: Install pinned c8 coverage tool
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/gtab10c-coverage-tools" --ignore-scripts --no-audit --no-fund --package-lock=false c8@12.0.0
          "$RUNNER_TEMP/gtab10c-coverage-tools/node_modules/.bin/c8" --version

      - name: Generate LCOV coverage with c8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p coverage
          ./node_modules/.bin/firebase emulators:exec \
            --project demo-seslitab-td06 \
            --only auth,firestore \
            "\"$RUNNER_TEMP/gtab10c-coverage-tools/node_modules/.bin/c8\" --reporter=lcov --reports-dir=coverage node --test --test-concurrency=1 --test-reporter=spec tests/*.test.js"
          test -s coverage/lcov.info

      - name: Checkout exact Editor qualification dependency
        uses: actions/checkout@v4
        with:
          repository: khfy7wpr5p-maker/st-guitar-tab-editor
          ref: 4eb479bc84b12c6deefb289d03c933ce9980bc9f
          path: .gtab10c-dependencies/editor
          persist-credentials: false

      - name: Checkout exact Semantic Engine qualification dependency
        uses: actions/checkout@v4
        with:
          repository: khfy7wpr5p-maker/st-score-semantic-engine
          ref: ef305f45ff90d940ac6c51a0c46c4fac006d7c5c
          path: .gtab10c-dependencies/semantic-engine
          persist-credentials: false

      - name: Set up CI-only Python oracle
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned oracle outside analyzed first-party source tree
        shell: bash
        run: |
          set -euo pipefail
          mv .gtab10c-dependencies "$RUNNER_TEMP/gtab10c-dependencies"
          python -m pip install --only-binary :all: --disable-pip-version-check "$RUNNER_TEMP/gtab10c-dependencies/semantic-engine" defusedxml==0.7.1 coverage==7.10.7

      - name: Cover actual pinned export and Python oracle execution
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
          GTAB10C_COVERAGE: '1'
          COVERAGE_RCFILE: .coveragerc-gtab10c
        run: |
          set -euo pipefail
          export GTAB_EDITOR_ROOT="$RUNNER_TEMP/gtab10c-dependencies/editor"
          export SEMANTIC_ENGINE_ROOT="$RUNNER_TEMP/gtab10c-dependencies/semantic-engine"
          export GTAB10C_PYTHON="$pythonLocation/bin/python"
          "$RUNNER_TEMP/gtab10c-coverage-tools/node_modules/.bin/c8" --reporter=lcov --reports-dir=coverage/gtab10c-integration node scripts/verifyGtab10cSemanticParity.js
          node --test tests/gtab10cOracleGraph.integration.mjs
          python -m coverage run --parallel-mode -m unittest discover -s tests/python -v
          python -m coverage combine
          python -m coverage xml
          python -m coverage report
          test -s coverage/gtab10c-integration/lcov.info
          test -s coverage/gtab10c-python.xml

      - name: Detect SonarQube configuration
        id: sonar-config
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          clean_organization="$(printf '%s' "$SONAR_ORGANIZATION" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          if [ -z "$SONAR_TOKEN" ]; then
            echo "mode=disabled" >> "$GITHUB_OUTPUT"
          elif [ -n "$SONAR_HOST_URL" ]; then
            echo "mode=server" >> "$GITHUB_OUTPUT"
          elif [ -n "$clean_organization" ]; then
            echo "mode=cloud" >> "$GITHUB_OUTPUT"
            echo "organization=$clean_organization" >> "$GITHUB_OUTPUT"
          else
            echo "mode=disabled" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarQube Server scan
        id: server-scan
        if: steps.sonar-config.outputs.mode == 'server'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Cloud scan
        id: cloud-scan
        if: steps.sonar-config.outputs.mode == 'cloud'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: >
            -Dsonar.organization=${{ steps.sonar-config.outputs.organization }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Stamp attempt-qualified Sonar task provenance
        if: always() && (steps.sonar-config.outputs.mode == 'server' || steps.sonar-config.outputs.mode == 'cloud')
        env:
          SONAR_SCAN_OUTCOME: ${{ steps.sonar-config.outputs.mode == 'server' && steps.server-scan.outcome || steps.cloud-scan.outcome }}
        run: node scripts/writeSonarRunProvenance.mjs

      - name: Upload attempt-qualified Sonar task provenance
        if: always() && (steps.sonar-config.outputs.mode == 'server' || steps.sonar-config.outputs.mode == 'cloud')
        uses: actions/upload-artifact@v4
        with:
          name: sonar-task-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .scannerwork/report-task.txt
            .scannerwork/run-provenance.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload Sonar Compute Engine task metadata
        if: always() && (steps.sonar-config.outputs.mode == 'server' || steps.sonar-config.outputs.mode == 'cloud')
        uses: actions/upload-artifact@v4
        with:
          name: sonar-report-task
          overwrite: true
          path: .scannerwork/report-task.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Report SonarCloud PR issues
        if: always() && steps.sonar-config.outputs.mode == 'cloud' && github.event_name == 'pull_request'
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/sonar-pr-diagnostics
          curl --silent --show-error --fail --max-time 30 \
            -u "${SONAR_TOKEN}:" \
            --get \
            --data-urlencode "componentKeys=khfy7wpr5p-maker_seslitab-guitar-reader" \
            --data-urlencode "pullRequest=${PR_NUMBER}" \
            --data-urlencode "issueStatuses=OPEN,CONFIRMED" \
            --data-urlencode "ps=100" \
            "https://sonarcloud.io/api/issues/search" > artifacts/sonar-pr-diagnostics/issues-current-pr-snapshot.json
          node - <<'NODE'
          const fs = require('node:fs')
          const data = JSON.parse(fs.readFileSync('artifacts/sonar-pr-diagnostics/issues-current-pr-snapshot.json', 'utf8'))
          console.log(`Sonar PR issue count: ${data.total ?? data.issues?.length ?? 0}`)
          for (const issue of data.issues ?? []) {
            console.log(JSON.stringify({
              rule: issue.rule,
              severity: issue.severity,
              type: issue.type,
              component: issue.component,
              line: issue.line ?? issue.textRange?.startLine ?? null,
              message: issue.message,
            }))
          }
          NODE
          # Query only a fixed trusted host. No artifact URL receives credentials.
          task_id="$(node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const text = fs.readFileSync('.scannerwork/report-task.txt', 'utf8')
          const rows = Object.fromEntries(text.trim().split(/\r?\n/u).map(row => { const at = row.indexOf('='); return [row.slice(0, at), row.slice(at + 1)] }))
          if (rows.serverUrl !== 'https://sonarcloud.io' || rows.projectKey !== 'khfy7wpr5p-maker_seslitab-guitar-reader' || !/^[A-Za-z0-9_-]{1,128}$/u.test(rows.ceTaskId ?? '')) throw new Error('Untrusted Sonar task identity')
          process.stdout.write(rows.ceTaskId)
          NODE
          )"
          curl --silent --show-error --fail --max-time 30 -u "${SONAR_TOKEN}:" --get \
            --data-urlencode "id=${task_id}" "https://sonarcloud.io/api/ce/task" > /tmp/sonar-pr-ce-task.json
          analysis_id="$(SONAR_EXPECTED_TASK_ID="$task_id" node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const { task } = JSON.parse(fs.readFileSync('/tmp/sonar-pr-ce-task.json', 'utf8'))
          if (task?.id !== process.env.SONAR_EXPECTED_TASK_ID || task?.componentKey !== 'khfy7wpr5p-maker_seslitab-guitar-reader' || !['PENDING', 'IN_PROGRESS', 'SUCCESS', 'FAILED', 'CANCELED'].includes(task.status)) throw new Error('Foreign or invalid CE task evidence')
          fs.writeFileSync('artifacts/sonar-pr-diagnostics/exact-ce-task.json', JSON.stringify({ task }, null, 2) + '\n')
          if (task?.status === 'SUCCESS' && /^[A-Za-z0-9_-]{1,128}$/u.test(task.analysisId ?? '')) process.stdout.write(task.analysisId)
          NODE
          )"
          if [ -n "$analysis_id" ]; then
            curl --silent --show-error --fail --max-time 30 -u "${SONAR_TOKEN}:" --get \
              --data-urlencode "analysisId=${analysis_id}" "https://sonarcloud.io/api/qualitygates/project_status" > artifacts/sonar-pr-diagnostics/exact-quality-gate.json
          fi
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const directory = 'artifacts/sonar-pr-diagnostics'
          const { task } = JSON.parse(fs.readFileSync(`${directory}/exact-ce-task.json`, 'utf8'))
          const gatePath = `${directory}/exact-quality-gate.json`
          const gate = fs.existsSync(gatePath) ? JSON.parse(fs.readFileSync(gatePath, 'utf8')).projectStatus : null
          const manifest = { workflowSha: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            taskId: task.id, analysisId: task.analysisId ?? null, ceStatus: task.status, gateStatus: gate?.status ?? null,
            issuesBinding: 'current PR inventory; not an immutable historical analysis snapshot' }
          fs.writeFileSync(`${directory}/manifest.json`, JSON.stringify(manifest, null, 2) + '\n')
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Sonar PR diagnostics: CE **${manifest.ceStatus}**, exact-analysis gate **${manifest.gateStatus ?? 'unavailable'}**. Issue inventory is the current PR snapshot, not historical evidence.\n`)
          NODE

      - name: Upload failed-or-passed Sonar PR diagnostic evidence
        if: always() && steps.sonar-config.outputs.mode == 'cloud' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sonar-pr-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/sonar-pr-diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Explain disabled SonarQube scan
        if: steps.sonar-config.outputs.mode == 'disabled'
        run: |
          echo "SonarQube scan is intentionally disabled until configuration exists."
          echo "Server: add SONAR_TOKEN and SONAR_HOST_URL as repository secrets."
          echo "Cloud: add SONAR_TOKEN as a secret and SONAR_ORGANIZATION as a repository variable."
