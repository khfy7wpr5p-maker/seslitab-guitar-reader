name: Package 1B nanoid lock remediation

on:
  push:
    branches:
      - security/package-1b-multer-remediation
    paths:
      - .github/workflows/package-1b-nanoid-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: security/package-1b-multer-remediation

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Update only transitive nanoid lock entry
        run: npm update nanoid --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify isolated secure lockfile change
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          echo "Changed files:"
          printf '%s\n' "$changed"
          if [ "$changed" != "package-lock.json" ]; then
            echo "FAIL: unexpected generated files"
            exit 1
          fi
          node --input-type=module -e "import fs from 'node:fs'; const l=JSON.parse(fs.readFileSync('package-lock.json','utf8')); const v=l.packages?.['node_modules/nanoid']?.version; console.log('nanoid', v); if (!v || v.localeCompare('3.3.18', undefined, {numeric:true}) < 0) process.exit(1)"
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
          git diff --check

      - name: Commit secure lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "chore: remediate transitive nanoid advisory"
          git push origin HEAD:security/package-1b-multer-remediation
