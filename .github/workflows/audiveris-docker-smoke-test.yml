name: Audiveris Docker smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - 'Dockerfile'
      - '.github/workflows/audiveris-docker-smoke-test.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.github/workflows/audiveris-docker-smoke-test.yml'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: seslitab-omr:smoke
          push: false

      - name: Start container
        id: start
        run: |
          docker run -d --name seslitab-smoke -p 8080:8080 \
            -e PORT=8080 \
            -e OMR_PROVIDER=audiveris \
            -e AUDIVERIS_COMMAND=/opt/audiveris/bin/Audiveris \
            seslitab-omr:smoke
          echo "container=seslitab-smoke" >> "$GITHUB_OUTPUT"

      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /tmp/health.json 2>/dev/null; then
              echo "Health endpoint responded:"
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo "Health endpoint did not respond within 60s"
          docker logs seslitab-smoke
          exit 1

      - name: Verify audiverisAvailable is true
        run: |
          AVAILABLE=$(jq -r '.data.runtime.audiverisAvailable' /tmp/health.json)
          echo "audiverisAvailable=$AVAILABLE"
          if [ "$AVAILABLE" != "true" ]; then
            echo "::error::audiverisAvailable is not true"
            cat /tmp/health.json
            exit 1
          fi

      - name: Verify tempWritable is true
        run: |
          TEMP_WRITABLE=$(jq -r '.data.runtime.tempWritable' /tmp/health.json)
          echo "tempWritable=$TEMP_WRITABLE"
          if [ "$TEMP_WRITABLE" != "true" ]; then
            echo "::error::tempWritable is not true"
            cat /tmp/health.json
            exit 1
          fi

      - name: Verify storageWritable is true
        run: |
          STORAGE_WRITABLE=$(jq -r '.data.runtime.storageWritable' /tmp/health.json)
          echo "storageWritable=$STORAGE_WRITABLE"
          if [ "$STORAGE_WRITABLE" != "true" ]; then
            echo "::error::storageWritable is not true"
            cat /tmp/health.json
            exit 1
          fi

      - name: Capture exact Audiveris version evidence
        run: |
          docker exec seslitab-smoke /opt/audiveris/bin/Audiveris -version > /tmp/audiveris-version.txt
          cat /tmp/audiveris-version.txt
          grep -F '5.11.0' /tmp/audiveris-version.txt

      - name: Capture CE-DATA-01B local Audiveris evidence
        run: |
          node scripts/local-audiveris-evidence-capture.js \
            tests/fixtures/golden-reference/plan0-cc0-4measure/plan0-cc0-4measure-source.pdf \
            --reference tests/fixtures/golden-reference/plan0-cc0-4measure/plan0-cc0-4measure-expected.musicxml \
            --gateway http://127.0.0.1:8080 \
            --engine-version 5.11.0 \
            --engine-version-file /tmp/audiveris-version.txt \
            --expected-source-sha256 c6e91647ba9dfcd38094f59848823ce3c92e7f5fe495747e2588ac0120f5bfed \
            --expected-reference-sha256 7004b4ac37711cca340c63e2f2436dd70e0f630f4e891cb311caff159b5d9d94 \
            --out artifacts/ce-data-01b-local-audiveris-capture

      - name: Upload CE-DATA-01B local evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ce-data-01b-local-audiveris-capture
          path: artifacts/ce-data-01b-local-audiveris-capture/
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup
        if: always()
        run: |
          docker rm -f seslitab-smoke 2>/dev/null || true
