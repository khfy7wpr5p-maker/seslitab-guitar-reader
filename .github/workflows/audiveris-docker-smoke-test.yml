name: Audiveris Docker smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - 'Dockerfile'
      - '.github/workflows/audiveris-docker-smoke-test.yml'
      - 'scripts/local-audiveris-evidence-capture.js'
      - 'scripts/run-local-audiveris-provider.js'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.github/workflows/audiveris-docker-smoke-test.yml'
      - 'scripts/local-audiveris-evidence-capture.js'
      - 'scripts/run-local-audiveris-provider.js'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: seslitab-omr:smoke
          push: false

      - name: Verify packaged gateway health endpoint
        run: |
          set -euo pipefail
          docker run -d --name seslitab-health -p 3001:3001 \
            -e OMR_PROVIDER=mock \
            seslitab-omr:smoke
          trap 'docker logs seslitab-health || true; docker rm -f seslitab-health >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/health > /tmp/seslitab-health.json; then
              cat /tmp/seslitab-health.json
              exit 0
            fi
            sleep 1
          done

          echo 'Packaged gateway /health did not become ready within 30 seconds.' >&2
          exit 1

      - name: Start isolated Audiveris container
        run: |
          docker run -d --name seslitab-smoke seslitab-omr:smoke sleep infinity
          docker exec --user seslitab seslitab-smoke mkdir -p /app/tmp/ce-data-01b /app/scripts

      - name: Capture exact Audiveris build and runtime evidence
        run: |
          set -euo pipefail
          mkdir -p /tmp/ce-data-01b
          grep -F 'ARG AUDIVERIS_VERSION=5.11.0' Dockerfile
          docker exec --user seslitab seslitab-smoke /opt/audiveris/bin/Audiveris -version > /tmp/ce-data-01b/runtime-version.txt
          {
            echo 'Audiveris pinned release: 5.11.0'
            echo "Dockerfile SHA-256: $(sha256sum Dockerfile | cut -d' ' -f1)"
            echo 'Runtime -version output:'
            cat /tmp/ce-data-01b/runtime-version.txt
          } > /tmp/ce-data-01b/audiveris-version.txt
          cat /tmp/ce-data-01b/audiveris-version.txt

      - name: Run real Audiveris provider directly inside container
        run: |
          set -euo pipefail
          docker cp tests/fixtures/golden-reference/plan0-cc0-4measure/plan0-cc0-4measure-source.pdf seslitab-smoke:/app/tmp/ce-data-01b/source.pdf
          docker cp scripts/run-local-audiveris-provider.js seslitab-smoke:/app/scripts/run-local-audiveris-provider.js
          docker exec --user seslitab \
            -e AUDIVERIS_COMMAND=/opt/audiveris/bin/Audiveris \
            -e AUDIVERIS_TIMEOUT_MS=110000 \
            seslitab-smoke \
            node /app/scripts/run-local-audiveris-provider.js /app/tmp/ce-data-01b/source.pdf /app/tmp/ce-data-01b

      - name: Extract direct Audiveris outputs
        run: |
          set -euo pipefail
          docker cp seslitab-smoke:/app/tmp/ce-data-01b/output.musicxml /tmp/ce-data-01b/output.musicxml
          if docker exec seslitab-smoke test -f /app/tmp/ce-data-01b/project.omr; then
            docker cp seslitab-smoke:/app/tmp/ce-data-01b/project.omr /tmp/ce-data-01b/project.omr
          fi
          test -s /tmp/ce-data-01b/output.musicxml

      - name: Package CE-DATA-01B pre-label evidence
        run: |
          set -euo pipefail
          OMR_ARGS=()
          if [ -s /tmp/ce-data-01b/project.omr ]; then
            OMR_ARGS=(--omr /tmp/ce-data-01b/project.omr)
          fi
          node scripts/local-audiveris-evidence-capture.js \
            tests/fixtures/golden-reference/plan0-cc0-4measure/plan0-cc0-4measure-source.pdf \
            --reference tests/fixtures/golden-reference/plan0-cc0-4measure/plan0-cc0-4measure-expected.musicxml \
            --musicxml /tmp/ce-data-01b/output.musicxml \
            "${OMR_ARGS[@]}" \
            --engine-version 5.11.0 \
            --engine-version-file /tmp/ce-data-01b/audiveris-version.txt \
            --source-repository khfy7wpr5p-maker/seslitab-guitar-reader \
            --source-revision-id fcfa70da2d81891d98dc1029862671c35217c00f \
            --license-id CC0-1.0 \
            --expected-source-sha256 c6e91647ba9dfcd38094f59848823ce3c92e7f5fe495747e2588ac0120f5bfed \
            --expected-reference-sha256 7004b4ac37711cca340c63e2f2436dd70e0f630f4e891cb311caff159b5d9d94 \
            --out artifacts/ce-data-01b-local-audiveris-capture

      - name: Upload CE-DATA-01B local evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ce-data-01b-local-audiveris-capture
          path: artifacts/ce-data-01b-local-audiveris-capture/
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup
        if: always()
        run: |
          docker rm -f seslitab-smoke 2>/dev/null || true
