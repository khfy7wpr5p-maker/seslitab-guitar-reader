name: Audiveris Docker smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - 'Dockerfile'
      - '.github/workflows/audiveris-docker-smoke-test.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.github/workflows/audiveris-docker-smoke-test.yml'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: seslitab-omr:smoke
          push: false

      - name: Start container
        id: start
        run: |
          docker run -d --name seslitab-smoke -p 8080:8080 \
            -e PORT=8080 \
            -e OMR_PROVIDER=audiveris \
            -e AUDIVERIS_COMMAND=/opt/audiveris/bin/Audiveris \
            seslitab-omr:smoke
          echo "container=seslitab-smoke" >> "$GITHUB_OUTPUT"

      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /tmp/health.json 2>/dev/null; then
              echo "Health endpoint responded:"
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo "Health endpoint did not respond within 60s"
          docker logs seslitab-smoke
          exit 1

      - name: Verify audiverisAvailable is true
        run: |
          AVAILABLE=$(jq -r '.data.runtime.audiverisAvailable' /tmp/health.json)
          echo "audiverisAvailable=$AVAILABLE"
          if [ "$AVAILABLE" != "true" ]; then
            echo "::error::audiverisAvailable is not true"
            cat /tmp/health.json
            exit 1
          fi

      - name: Verify tempWritable is true
        run: |
          TEMP_WRITABLE=$(jq -r '.data.runtime.tempWritable' /tmp/health.json)
          echo "tempWritable=$TEMP_WRITABLE"
          if [ "$TEMP_WRITABLE" != "true" ]; then
            echo "::error::tempWritable is not true"
            cat /tmp/health.json
            exit 1
          fi

      - name: Verify storageWritable is true
        run: |
          STORAGE_WRITABLE=$(jq -r '.data.runtime.storageWritable' /tmp/health.json)
          echo "storageWritable=$STORAGE_WRITABLE"
          if [ "$STORAGE_WRITABLE" != "true" ]; then
            echo "::error::storageWritable is not true"
            cat /tmp/health.json
            exit 1
          fi

      - name: Run Audiveris -version inside container
        run: |
          docker exec seslitab-smoke /opt/audiveris/bin/Audiveris -version

      - name: Cleanup
        if: always()
        run: |
          docker rm -f seslitab-smoke 2>/dev/null || true
