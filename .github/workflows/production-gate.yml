name: Production Gate

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: production-gate-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  exact-main-production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate trusted CI source before checkout
        id: source
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo
            const repository = `${owner}/${repo}`
            const eventRun = context.payload.workflow_run
            function validate(run, workflowId) {
              if (!run || run.repository?.full_name !== repository || run.repository?.fork !== false ||
                  run.head_repository?.full_name !== repository || run.head_repository?.fork !== false ||
                  run.event !== 'push' || run.head_branch !== 'main' || run.name !== 'CI' ||
                  run.status !== 'completed' || run.conclusion !== 'success' || run.run_attempt !== 1 ||
                  !Number.isSafeInteger(run.id) || run.id < 1 || !/^[0-9a-f]{40}$/.test(run.head_sha ?? '') ||
                  !['.github/workflows/ci.yml', '.github/workflows/ci.yml@main', '.github/workflows/ci.yml@refs/heads/main'].includes(run.path) ||
                  run.workflow_id !== workflowId) throw new Error('production-gate-untrusted-ci-source')
            }
            const { data: workflow } = await github.rest.actions.getWorkflow({ owner, repo, workflow_id: 'ci.yml' })
            if (workflow.path !== '.github/workflows/ci.yml' || workflow.name !== 'CI' ||
                !Number.isSafeInteger(workflow.id) || workflow.id < 1) throw new Error('production-gate-ci-workflow-invalid')
            validate(eventRun, workflow.id)
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: eventRun.id })
            validate(run, workflow.id)
            const { data: main } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' })
            if (run.id !== eventRun.id || run.head_sha !== eventRun.head_sha || main.commit.sha !== run.head_sha) {
              throw new Error('production-gate-source-drift')
            }
            core.setOutput('sha', run.head_sha)

      - name: Checkout exact merged main revision
        if: ${{ success() && github.event.workflow_run.repository.full_name == github.repository && github.event.workflow_run.repository.fork == false && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_repository.fork == false && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Select trusted exact-main Regression Quality attempt
        id: evidence
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs')
            const { pathToFileURL } = require('node:url')
            const { selectPostMergeGitHubEvidence } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/postMergeProductionGate.js`).href)
            const { owner, repo } = context.repo
            const repository = `${owner}/${repo}`
            const triggerRunId = context.payload.workflow_run.id
            const { data: ciWorkflow } = await github.rest.actions.getWorkflow({ owner, repo, workflow_id: 'ci.yml' })
            const { data: regressionWorkflow } = await github.rest.actions.getWorkflow({ owner, repo, workflow_id: 'regression-quality.yml' })
            if (ciWorkflow.path !== '.github/workflows/ci.yml' || regressionWorkflow.path !== '.github/workflows/regression-quality.yml' ||
                regressionWorkflow.name !== 'Regression Quality') throw new Error('production-gate-workflow-invalid')
            const workflowIds = { ci: ciWorkflow.id, regression: regressionWorkflow.id }
            let selected
            for (let attempt = 0; attempt < 36; attempt += 1) {
              const { data: triggerRun } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: triggerRunId })
              const { data: main } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' })
              const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({ owner, repo,
                head_sha: context.payload.workflow_run.head_sha, event: 'push', per_page: 100 })
              try {
                selected = selectPostMergeGitHubEvidence({ repository, triggerRun, regressionRuns: runs.workflow_runs,
                  currentMainSha: main.commit.sha, workflowIds, verifiedAt: new Date().toISOString() })
                break
              } catch (error) {
                if (!['production-gate-regression-missing', 'production-gate-regression-pending'].includes(error.message)) throw error
              }
              if (attempt < 35) await new Promise((resolve) => setTimeout(resolve, 10000))
            }
            if (!selected) throw new Error('production-gate-regression-timeout')
            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo,
              run_id: selected.regressionQuality.runId, per_page: 100 })
            const matches = artifacts.artifacts.filter((artifact) => artifact.name === selected.artifactName)
            if (matches.length !== 1 || matches[0].expired || matches[0].workflow_run?.id !== selected.regressionQuality.runId ||
                matches[0].workflow_run?.head_sha !== selected.headSha) throw new Error('production-gate-attempt-artifact-invalid')
            fs.mkdirSync('artifacts', { recursive: true })
            fs.writeFileSync('artifacts/github-gate-input.json', JSON.stringify(selected), { mode: 0o600 })
            core.setOutput('run_id', String(selected.regressionQuality.runId))
            core.setOutput('artifact_name', selected.artifactName)

      - name: Download exact attempt Sonar metadata
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.evidence.outputs.artifact_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.evidence.outputs.run_id }}
          path: artifacts/sonar-report-task

      - name: Verify exact CE and current-main Sonar quality acceptance
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: node scripts/verifyExactMainSonar.mjs

      - name: Recheck main and run attempt before issuing acceptance
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs')
            const { pathToFileURL } = require('node:url')
            const { evaluatePostMergeProductionGate } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/postMergeProductionGate.js`).href)
            const selected = JSON.parse(fs.readFileSync('artifacts/github-gate-input.json', 'utf8'))
            const sonarEvidence = JSON.parse(fs.readFileSync('artifacts/production-sonar-evidence.json', 'utf8'))
            const { owner, repo } = context.repo
            const { data: triggerRun } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: selected.ci.runId })
            const { data: regression } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: selected.regressionQuality.runId })
            if (regression.run_attempt !== selected.regressionQuality.runAttempt) throw new Error('production-gate-attempt-changed')
            const { data: main } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' })
            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({ owner, repo, head_sha: selected.headSha, event: 'push', per_page: 100 })
            const currentRuns = runs.workflow_runs.map((run) => run.id === regression.id ? regression : run)
            const projectKeys = [...fs.readFileSync('sonar-project.properties', 'utf8').matchAll(/^sonar\.projectKey=(.*)$/gm)]
            if (projectKeys.length !== 1) throw new Error('production-gate-project-invalid')
            const attestation = evaluatePostMergeProductionGate({ repository: selected.repository, triggerRun,
              regressionRuns: currentRuns, currentMainSha: main.commit.sha,
              workflowIds: { ci: selected.ci.workflowId, regression: selected.regressionQuality.workflowId },
              projectKey: projectKeys[0][1], sonarEvidence, verifiedAt: new Date().toISOString() })
            fs.writeFileSync('artifacts/production-gate.json', JSON.stringify(attestation, null, 2) + '\n', { mode: 0o600 })
            core.info(`Production Gate PASS for ${attestation.headSha}`)

      - name: Upload production-gate attestation
        uses: actions/upload-artifact@v4
        with:
          name: production-gate-attestation-${{ github.event.workflow_run.head_sha }}
          path: artifacts/production-gate.json
          if-no-files-found: error
          retention-days: 30
