name: SMENU native menu proof

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smenu-native-menu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-menu-proof:
    name: Native File Score Notes proof
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build production bundle
        run: npm run build

      - name: Capture installed Smoosic reflection contract
        run: node scripts/inspectSmoosic1044Reflection.js

      - name: Verify native Smoosic menu layout in real browser
        shell: bash
        run: |
          set +e
          node scripts/verifySmoosicNativeMenuLayoutBrowserV3.js
          proof_status=$?
          set -e
          if [ "$proof_status" -ne 0 ]; then
            node --input-type=module -e "import { readFileSync } from 'node:fs'; const path='artifacts/smenu-native-menu-layout-v3.json'; const e=JSON.parse(readFileSync(path,'utf8')); const labels=['File','Score','Notes']; const failed=labels.filter((label)=>!e.results?.[label]?.layout?.functional); if (e.failure || failed.length) { console.error('SMENU proof failure:', e.failure?.message || failed.join(', ')); process.exit(1); } console.log('SMENU product proof is GREEN; browser temp-profile cleanup was non-functional noise.');"
          fi

      - name: Upload SMENU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smenu-native-menu-evidence
          path: |
            artifacts/smenu-native-menu-layout-v3.json
            artifacts/smenu-smoosic-reflection-contract.json
          if-no-files-found: warn
