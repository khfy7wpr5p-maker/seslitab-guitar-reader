name: Package 1B lock sync

on:
  push:
    branches:
      - security/package-1b-multer-remediation
    paths:
      - package.json
      - .github/workflows/package-1b-lock-sync.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: security/package-1b-multer-remediation

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify isolated lockfile change
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          echo "Changed files:"
          printf '%s\n' "$changed"
          if [ "$changed" != "package-lock.json" ]; then
            echo "FAIL: unexpected generated files"
            exit 1
          fi
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if (p.dependencies.multer !== '2.2.0' || l.packages[''].dependencies.multer !== '2.2.0' || l.packages['node_modules/multer'].version !== '2.2.0') process.exit(1)"
          git diff --check

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "chore: synchronize Multer 2.2.0 lockfile"
          git push origin HEAD:security/package-1b-multer-remediation
