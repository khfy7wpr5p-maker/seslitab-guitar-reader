name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java 21 for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify TD-06 Firebase emulator boundary
        run: npm run test:td06:emulator

      - name: Run tests
        run: npm test

      - name: Verify S16 read-only request guard in serialized real browser
        run: npm run test:s16:browser

      - name: Verify SES-147 authenticated roster gate in real browser
        run: node scripts/verifySes147AuthRosterBrowser.js

      - name: Verify SES-153 teacher-authority SCORE sends in real browser
        run: node scripts/verifySes153TeacherAuthorityBrowser.js

      - name: Build production bundle
        run: npm run build

      - name: Verify S16 build composition identity
        run: node scripts/verifyS16BuildCompositionManifest.js

      - name: Upload S16 build composition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seslitab-build-composition
          path: dist/seslitab-build.json
          if-no-files-found: warn

      - name: Verify S14 core score runtime in real browser
        run: node scripts/verifyS14CoreRuntimeBrowser.js

      - name: Verify S14 Smoosic production integration in real browser
        run: node scripts/verifyS14SmoosicProductionCdpBrowser.js

      - name: Verify S14 mobile menu stays below sticky host header
        run: node scripts/verifyS14MobileMenuHostOcclusionBrowser.js

      - name: Verify S14 failed replacement stays on last accepted score
        run: node scripts/verifyS14FailedReplacementBrowser.js

      - name: Verify S14 complete source lifecycle acceptance
        run: node scripts/verifyS14SourceLifecycleAcceptanceBrowser.js

      - name: Verify S15 Smoosic write-back in real browser
        run: node scripts/verifyS15SmoosicWritebackBrowser.js

      - name: Upload S15 Smoosic write-back evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s15-smoosic-writeback
          path: artifacts/s15-smoosic-writeback.json
          if-no-files-found: warn

      - name: Verify CE-BRIDGE structural write-back in real browser
        run: node scripts/verifyCeBridgeStructuralBrowser.js

      - name: Upload CE-BRIDGE structural browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ce-bridge-structural-browser
          path: artifacts/ce-bridge-structural-browser.json
          if-no-files-found: warn

      - name: Verify SES-120 Smoosic correction overlay in real browser
        run: node scripts/verifySmoosicCorrectionOverlayBrowser.js

      - name: Upload SES-120 Smoosic correction overlay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ses-120-smoosic-correction-overlay-browser
          path: artifacts/ses-120-smoosic-correction-overlay-browser.json
          if-no-files-found: warn

      - name: Verify STI-17 cross-realm iframe renderer in real browser
        run: node scripts/verifySti17CrossRealmBrowser.js

      - name: Verify STI-17 single selection authority after rerender in real browser
        run: node scripts/verifySti17SingleSelectionAuthorityBrowser.js

      - name: Verify STI-17 mobile editor cleanup in real browser
        run: node scripts/verifySti17MobileEditorCleanupBrowser.js

      - name: Verify PR-C keypad in real browser
        run: node scripts/verifyPrCKeypadBrowser.js

      - name: Verify PR-D editor product pipeline in real browser
        run: node scripts/verifyPrDEditorBrowser.js

      - name: Verify PR-E quality routing recovery in real browser
        run: node scripts/verifyPrECoexistenceBrowser.js

      - name: Verify PR-F accessibility mobile regression in real browser
        run: node scripts/verifyPrFAccessibilityBrowser.js

      - name: Verify S14 production mobile scroll-settle in real browser
        run: node scripts/verifyS14MobileScrollSettleProductionBrowser.js

      - name: Upload S14 production mobile scroll-settle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoosic-mobile-scroll-settle-production
          path: artifacts/smoosic-mobile-scroll-settle-production.json
          if-no-files-found: warn


  td-prod-10-teacher-student-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STUDENT_APP_SHA: b59bcb6dc5525f035515ab358734ebbe5a277fbb
      RENDERER_SHA: 13aa0843158257a207afe062879743d58048cc6d

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]

    steps:
      - name: Checkout SesliTab teacher exact PR head
        uses: actions/checkout@v4
        with:
          path: teacher

      - name: Checkout Student App at approved revision
        uses: actions/checkout@v4
        with:
          repository: khfy7wpr5p-maker/st-student-app
          ref: ${{ env.STUDENT_APP_SHA }}
          path: student-app

      - name: Checkout Rendering Layer at approved revision
        uses: actions/checkout@v4
        with:
          repository: khfy7wpr5p-maker/st-score-rendering-layer
          ref: ${{ env.RENDERER_SHA }}
          path: renderer

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install teacher dependencies
        working-directory: teacher
        run: npm ci --ignore-scripts

      - name: Install Student App dependencies
        working-directory: student-app
        run: npm ci --ignore-scripts

      - name: Restore pinned Student App renderer dependency lock
        working-directory: renderer
        run: cp "$GITHUB_WORKSPACE/student-app/ci/renderer-package-lock.json" package-lock.json

      - name: Build approved renderer
        working-directory: renderer
        run: npm ci --ignore-scripts && npm run build

      - name: Export approved Student App browser runtime
        working-directory: renderer
        env:
          ST_SCORE_RENDERER_SOURCE_REVISION: ${{ env.RENDERER_SHA }}
        run: node scripts/export-browser-runtime.mjs browser-runtime

      - name: Verify renderer runtime provenance
        working-directory: renderer
        run: |
          node -e 'const m=require("./dist/browser-runtime/runtime-manifest.json"); if(m.runtimeTarget!=="browser" || m.rendererSourceRevision!==process.env.RENDERER_SHA || m.scoreRendererContractVersion!=="0.2.0") process.exit(1)'

      - name: Install approved renderer runtime into Student App checkout
        run: |
          mkdir -p student-app/vendor/st-score-runtime
          cp -R renderer/dist/browser-runtime/. student-app/vendor/st-score-runtime/

      - name: Install Task 10 qualification harness into Student App checkout
        run: |
          cp teacher/qualification/td-prod-10/student-app-e2e-fixture-adapter.mjs student-app/browser-tests/support/td-prod-10-e2e-fixture-adapter.mjs
          cp teacher/qualification/td-prod-10/student-app-e2e-bootstrap.mjs student-app/browser-tests/support/td-prod-10-e2e-bootstrap.mjs
          cp teacher/qualification/td-prod-10/student-app-e2e.spec.mjs student-app/browser-tests/td-prod-10-teacher-delivery.spec.mjs

      - name: Generate exact teacher-delivered Student App fixture
        working-directory: teacher
        run: node scripts/writeTdProd10StudentFixture.js ../student-app/browser-tests/support/td-prod-10-generated-fixture.mjs

      - name: Install qualification browser
        working-directory: student-app
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Qualify teacher delivery in real Student App browser
        working-directory: student-app
        env:
          ST_BROWSER: ${{ matrix.browser }}
        run: node --test browser-tests/td-prod-10-teacher-delivery.spec.mjs
