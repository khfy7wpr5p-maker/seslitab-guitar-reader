name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Verify score runtime in real browser
        run: node scripts/verifyScoreRuntimeBrowser.js

      - name: Verify PR-C keypad in real browser
        run: node scripts/verifyPrCKeypadBrowser.js

      - name: Verify PR-D editor product pipeline in real browser
        run: node scripts/verifyPrDEditorBrowser.js
