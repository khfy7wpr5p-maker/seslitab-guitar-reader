name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java 21 for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify TD-06 Firebase emulator boundary
        run: npm run test:td06:emulator

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Verify S14 core score runtime in real browser
        run: node scripts/verifyS14CoreRuntimeBrowser.js

      - name: Verify S14 Smoosic production integration in real browser
        run: node scripts/verifyS14SmoosicProductionCdpBrowser.js

      - name: Verify S14 mobile menu stays below sticky host header
        run: node scripts/verifyS14MobileMenuHostOcclusionBrowser.js

      - name: Verify S14 failed replacement stays on last accepted score
        run: node scripts/verifyS14FailedReplacementBrowser.js

      - name: Verify S14 complete source lifecycle acceptance
        run: node scripts/verifyS14SourceLifecycleAcceptanceBrowser.js

      - name: Verify STI-17 cross-realm iframe renderer in real browser
        run: node scripts/verifySti17CrossRealmBrowser.js

      - name: Verify STI-17 single selection authority after rerender in real browser
        run: node scripts/verifySti17SingleSelectionAuthorityBrowser.js

      - name: Verify STI-17 mobile editor cleanup in real browser
        run: node scripts/verifySti17MobileEditorCleanupBrowser.js

      - name: Verify PR-C keypad in real browser
        run: node scripts/verifyPrCKeypadBrowser.js

      - name: Verify PR-D editor product pipeline in real browser
        run: node scripts/verifyPrDEditorBrowser.js

      - name: Verify PR-E quality routing recovery in real browser
        run: node scripts/verifyPrECoexistenceBrowser.js

      - name: Verify PR-F accessibility mobile regression in real browser
        run: node scripts/verifyPrFAccessibilityBrowser.js

      - name: Verify S14 production mobile scroll-settle in real browser
        run: node scripts/verifyS14MobileScrollSettleProductionBrowser.js

      - name: Upload S14 production mobile scroll-settle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoosic-mobile-scroll-settle-production
          path: artifacts/smoosic-mobile-scroll-settle-production.json
          if-no-files-found: warn
