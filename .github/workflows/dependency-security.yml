name: Dependency Security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit production and full dependency graphs
        id: audit
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          npm audit --omit=dev --audit-level=high --json > artifacts/npm-audit-production.json
          production_status=$?
          npm audit --audit-level=high --json > artifacts/npm-audit-full.json
          full_status=$?
          set -e

          node - <<'NODE'
          const fs = require('node:fs')
          for (const [label, file] of [
            ['production', 'artifacts/npm-audit-production.json'],
            ['full', 'artifacts/npm-audit-full.json'],
          ]) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'))
            const v = report.metadata?.vulnerabilities || {}
            console.log(`${label}: info=${v.info || 0} low=${v.low || 0} moderate=${v.moderate || 0} high=${v.high || 0} critical=${v.critical || 0} total=${v.total || 0}`)
            for (const [name, finding] of Object.entries(report.vulnerabilities || {})) {
              console.log(JSON.stringify({
                graph: label,
                name,
                severity: finding.severity,
                isDirect: finding.isDirect,
                via: finding.via,
                effects: finding.effects,
                range: finding.range,
                nodes: finding.nodes,
                fixAvailable: finding.fixAvailable,
              }))
            }
          }
          NODE

          if [ "$production_status" -ne 0 ] || [ "$full_status" -ne 0 ]; then
            echo "High-or-critical dependency vulnerability detected."
            exit 1
          fi

      - name: Upload npm audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: td-prod-15-npm-audit
          path: |
            artifacts/npm-audit-production.json
            artifacts/npm-audit-full.json
          if-no-files-found: error
          retention-days: 30
