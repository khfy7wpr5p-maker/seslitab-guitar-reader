name: Dependency Security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit production and full dependency graphs
        id: audit
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          npm audit --omit=dev --audit-level=high --json > artifacts/npm-audit-production.json
          production_status=$?
          npm audit --audit-level=high --json > artifacts/npm-audit-full.json
          full_status=$?
          set -e

          PRODUCTION_STATUS="$production_status" FULL_STATUS="$full_status" node - <<'NODE'
          const fs = require('node:fs')

          const approvedModerate = Object.freeze({
            production: new Set(['gaxios', 'uuid']),
            full: new Set([
              '@google-cloud/pubsub',
              '@opentelemetry/core',
              'firebase-tools',
              'gaxios',
              'uuid',
            ]),
          })

          let unexpectedModerate = false

          for (const [label, file] of [
            ['production', 'artifacts/npm-audit-production.json'],
            ['full', 'artifacts/npm-audit-full.json'],
          ]) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'))
            const vulnerabilities = report.metadata?.vulnerabilities || {}
            console.log(
              `${label}: info=${vulnerabilities.info || 0} low=${vulnerabilities.low || 0} moderate=${vulnerabilities.moderate || 0} high=${vulnerabilities.high || 0} critical=${vulnerabilities.critical || 0} total=${vulnerabilities.total || 0}`,
            )

            for (const [name, finding] of Object.entries(report.vulnerabilities || {})) {
              console.log(JSON.stringify({
                graph: label,
                name,
                severity: finding.severity,
                isDirect: finding.isDirect,
                via: finding.via,
                effects: finding.effects,
                range: finding.range,
                nodes: finding.nodes,
                fixAvailable: finding.fixAvailable,
              }))

              if (
                finding.severity === 'moderate' &&
                !approvedModerate[label].has(name)
              ) {
                console.error(
                  `Unexpected moderate dependency vulnerability in ${label} graph: ${name}`,
                )
                unexpectedModerate = true
              }
            }
          }

          if (
            process.env.PRODUCTION_STATUS !== '0' ||
            process.env.FULL_STATUS !== '0'
          ) {
            throw new Error('high-or-critical-dependency-vulnerability-detected')
          }

          if (unexpectedModerate) {
            throw new Error('unclassified-moderate-dependency-vulnerability-detected')
          }
          NODE

      - name: Upload npm audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: td-prod-15-npm-audit
          path: |
            artifacts/npm-audit-production.json
            artifacts/npm-audit-full.json
          if-no-files-found: error
          retention-days: 30
