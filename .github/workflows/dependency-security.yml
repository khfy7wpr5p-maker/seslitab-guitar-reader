name: Dependency Security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit production and full dependency graphs
        id: audit
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          npm audit --omit=dev --json > artifacts/npm-audit-production.json
          production_status=$?
          npm audit --json > artifacts/npm-audit-full.json
          full_status=$?
          set -e

          PRODUCTION_STATUS="$production_status" FULL_STATUS="$full_status" node - <<'NODE'
          const fs = require('node:fs')

          for (const [label, file] of [
            ['production', 'artifacts/npm-audit-production.json'],
            ['full', 'artifacts/npm-audit-full.json'],
          ]) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'))
            if (report.error || !report.metadata?.vulnerabilities ||
                !report.vulnerabilities || typeof report.vulnerabilities !== 'object' ||
                Array.isArray(report.vulnerabilities)) {
              throw new Error(`invalid-dependency-audit-report: ${label}`)
            }
            const vulnerabilities = report.metadata.vulnerabilities
            for (const severity of ['info', 'low', 'moderate', 'high', 'critical', 'total']) {
              if (!Number.isInteger(vulnerabilities[severity]) || vulnerabilities[severity] < 0) {
                throw new Error(`invalid-dependency-audit-summary: ${label}/${severity}`)
              }
              if (vulnerabilities[severity] !== 0) {
                throw new Error(`dependency-vulnerability-detected: ${label}/${severity}`)
              }
            }
            if (Object.keys(report.vulnerabilities).length !== 0) {
              throw new Error(`dependency-vulnerability-detected: ${label}/inventory`)
            }
            console.log(
              `${label}: info=${vulnerabilities.info || 0} low=${vulnerabilities.low || 0} moderate=${vulnerabilities.moderate || 0} high=${vulnerabilities.high || 0} critical=${vulnerabilities.critical || 0} total=${vulnerabilities.total || 0}`,
            )

          }

          if (
            process.env.PRODUCTION_STATUS !== '0' ||
            process.env.FULL_STATUS !== '0'
          ) {
            throw new Error('dependency-audit-command-failed')
          }

          NODE

      - name: Upload npm audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: td-prod-15-npm-audit
          path: |
            artifacts/npm-audit-production.json
            artifacts/npm-audit-full.json
          if-no-files-found: error
          retention-days: 30
